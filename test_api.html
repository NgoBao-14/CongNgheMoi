<!DOCTYPE html>
<html>
<head>
    <title>Test API</title>
</head>
<body>
    <h1>Test Dashboard API</h1>
    <button onclick="testThesis()">Test Thesis API</button>
    <button onclick="testNotification()">Test Notification API</button>
    <pre id="result"></pre>

    <script>
        function testThesis() {
            fetch('/CongNgheMoi/SinhVien/getTTDeTaiForDashboard')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    document.getElementById('result').textContent = 'Error: ' + error;
                });
        }

        function testNotification() {
            fetch('/CongNgheMoi/SinhVien/getThongBaoDeTai')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    document.getElementById('result').textContent = 'Error: ' + error;
                });
        }
    </script>
</body>
</html>
