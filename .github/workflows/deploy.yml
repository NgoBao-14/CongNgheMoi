name: Build and Deploy to Docker Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/congnghemoi-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pull image mới
            docker pull ${{ env.DOCKER_IMAGE }}:latest
            
            # Dừng và xóa container cũ
            docker stop congnghemoi_app || true
            docker rm congnghemoi_app || true
            
            # Chạy container mới với biến môi trường
            docker run -d \
              --name congnghemoi_app \
              -p 80:80 \
              -e USE_CLOUD_SQL=${{ secrets.USE_CLOUD_SQL }} \
              -e CLOUD_SQL_HOST=${{ secrets.CLOUD_SQL_HOST }} \
              -e CLOUD_SQL_USER=${{ secrets.CLOUD_SQL_USER }} \
              -e CLOUD_SQL_PASS=${{ secrets.CLOUD_SQL_PASS }} \
              -e CLOUD_SQL_NAME=${{ secrets.CLOUD_SQL_NAME }} \
              --restart unless-stopped \
              ${{ env.DOCKER_IMAGE }}:latest
            
            # Xóa images cũ không dùng
            docker image prune -f
